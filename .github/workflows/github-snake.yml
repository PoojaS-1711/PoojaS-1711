name: Generate Contribution Snake
 
on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
 
jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: PoojaS-1711
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Fix dist ownership/permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist && chmod -R u+rwX dist
 
      - name: Recolor snake to pink/purple palette
        run: |
          for f in dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg; do
            sed -i 's/#ebedf0/#1c0f2e/g; s/#9be9a8/#3a1f52/g; s/#40c463/#9b5cff/g; s/#30a14e/#c93cc4/g; s/#216e39/#ff4fa3/g' "$f"
          done
 
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
